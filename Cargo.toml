[package]
name = "omegaclaw"
version = "0.1.0"
edition = "2021"
description = "OmegaClaw: auditable Web3 security evidence and control plane"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
thiserror = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
hyperon = { git = "https://github.com/trueagi-io/hyperon-experimental.git", rev = "3f76dc460da6961f57f69f6c3e550c59c74ada83", default-features = false, features = ["pkg_mgmt"] }
url = "2"
jsonschema = "0.18"

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
tempfile = "3"
